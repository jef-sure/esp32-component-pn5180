## IDF Component Manager Manifest File
version: "0.8.0"
description: "ESP-IDF component for NXP PN5180 NFC/RFID reader with multi-card polling, ISO14443A, ISO15693, MIFARE, and NDEF support"
url: https://github.com/jef-sure/esp32-component-pn5180
repository: https://github.com/jef-sure/esp32-component-pn5180.git
documentation: https://github.com/jef-sure/esp32-component-pn5180/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-pn5180/issues

dependencies:
  idf:
    version: ">=5.0.4"

tags:
  - nfc
  - rfid
  - multi-card
  - pn5180
  - iso14443a
  - iso15693
  - mifare
  - ndef
  - spi

maintainers:
  - "Anton Petrusevich <anton.petrusevich.mobile@gmail.com>"

license: MIT

files:
  # Only what is listed under include goes into the archive: include is applied after exclude,
  # and without an exclude of everything it would limit nothing.
  exclude:
    - "**/*"
  include:
    - "src/**/*.c"
    - "include/**/*.h"
    - "CMakeLists.txt"
    - "examples/*/main/*.c"
    - "examples/*/main/*.h"
    - "examples/*/CMakeLists.txt"
    - "examples/*/main/CMakeLists.txt"
    - "examples/*/main/idf_component.yml"
    - "idf_component.yml"
    - "README.md"
    - "CHANGES.md"
    - "LICENSE"

version: 0.0.1
maintainers:
- Anton Petrusevich <anton.petrusevich.mobile@gmail.com>
description: ESP-IDF component for NXP PN5180 NFC/RFID reader with ISO14443A, 
  ISO15693, MIFARE, and NDEF support
license: MIT
tags:
- nfc
- rfid
- pn5180
- iso14443a
- iso15693
- mifare
- ndef
- spi
dependencies:
  idf:
    version: '>=5.0.0'
files:
  include:
  - '**/*.c'
  - '**/*.h'
  - '**/CMakeLists.txt'
  - README.md
  - LICENSE
  exclude:
  - build/**
  - dist/**
  - examples/**
  - .git/**
  - .vscode/**
  - '**/*.old'
url: https://github.com/jef-sure/esp32-component-pn5180
repository: https://github.com/jef-sure/esp32-component-pn5180.git
documentation: 
  https://github.com/jef-sure/esp32-component-pn5180/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-pn5180/issues
